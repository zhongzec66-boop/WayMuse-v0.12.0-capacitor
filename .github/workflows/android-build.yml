name: Build Android APK

on:
  workflow_dispatch:
  # 该 workflow 只存在于 feat/native-compose 分支时，workflow_dispatch API
  # 会返回 404（GitHub 只认默认分支上的 workflow）。挂一个 push 触发兜底。
  push:
    branches:
      - feat/native-compose
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WayMuse
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Capacitor 8 的 Android 模板用 Gradle 8.14，需要 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Check and build web app
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      # variables.gradle 里是 compileSdk/targetSdk 36，必须显式装对应平台
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p build/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build/apk/WayMuse-android-debug.apk
          ls -la build/apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WayMuse-android-apk
          path: build/apk/WayMuse-android-debug.apk
          if-no-files-found: error
          retention-days: 7
