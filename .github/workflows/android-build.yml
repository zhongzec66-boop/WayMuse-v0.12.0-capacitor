name: Build Android APK

on:
  workflow_dispatch:
  # 该 workflow 只存在于 feat/native-compose 分支时，workflow_dispatch API
  # 会返回 404（GitHub 只认默认分支上的 workflow）。挂一个 push 触发兜底。
  push:
    branches:
      - feat/native-compose
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    env:
      # time-sensitive tests assume Asia/Shanghai; CI defaults to UTC
      TZ: Asia/Shanghai
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WayMuse
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Capacitor 8 的 Android 模板用 Gradle 8.14，需要 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 不要用 android-actions/setup-android@v3：它在当前 runner 镜像上会执行
      # `sdkmanager tools`，而 tools 包已从 SDK 仓库移除，直接以 exit 1 失败。
      # ubuntu-latest 自带 Android SDK，直接用 sdkmanager 装缺的平台即可。
      - name: Install Android SDK packages
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKM=sdkmanager
          else
            SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          fi
          echo "sdkmanager = $SDKM"
          echo "ANDROID_HOME = $ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Check and build web app
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      # 正式签名证书放在 GitHub Secrets 里，构建时还原到临时目录。
      # 固定证书的好处：后续版本可以直接覆盖安装，不会因为签名变化要求卸载。
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/waymuse-release.jks"
          ls -l "$RUNNER_TEMP/waymuse-release.jks"

      # GitHub 的 release CDN 会间歇性 504（Gradle 发行包也走这里）。
      # 缓存 wrapper 与依赖，并且在失败时重试整条 gradle 命令。
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/waymuse-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              echo "gradle succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::gradle failed (attempt $attempt), retrying in 20s"
            sleep 20
          done
          echo "::error::gradle failed after 4 attempts"
          exit 1

      - name: Collect APK
        run: |
          mkdir -p build/apk
          cp android/app/build/outputs/apk/release/app-release.apk build/apk/WayMuse-android.apk
          ls -la build/apk

      # 打印签名指纹：既确认用的是我们的证书，也方便和手机上的信息对照
      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -n1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/apk/WayMuse-android.apk | head -n 12
          else
            echo "apksigner not found, skip"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: WayMuse-android-apk
          path: build/apk/WayMuse-android.apk
          if-no-files-found: error
          retention-days: 7
