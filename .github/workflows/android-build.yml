name: Build Android APK

on:
  workflow_dispatch:
  # 该 workflow 只存在于 feat/native-compose 分支时，workflow_dispatch API
  # 会返回 404（GitHub 只认默认分支上的 workflow）。挂一个 push 触发兜底。
  push:
    branches:
      - feat/native-compose
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WayMuse
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Capacitor 8 的 Android 模板用 Gradle 8.14，需要 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 不要用 android-actions/setup-android@v3：它在当前 runner 镜像上会执行
      # `sdkmanager tools`，而 tools 包已从 SDK 仓库移除，直接以 exit 1 失败。
      # ubuntu-latest 自带 Android SDK，直接用 sdkmanager 装缺的平台即可。
      - name: Install Android SDK packages
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKM=sdkmanager
          else
            SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          fi
          echo "sdkmanager = $SDKM"
          echo "ANDROID_HOME = $ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Check and build web app
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p build/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build/apk/WayMuse-android-debug.apk
          ls -la build/apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WayMuse-android-apk
          path: build/apk/WayMuse-android-debug.apk
          if-no-files-found: error
          retention-days: 7
