name: WayMuseNative
options:
  bundleIdPrefix: app.waymuse
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: 1
targets:
  WayMuseNative:
    type: application
    platform: iOS
    deploymentTarget: '15.0'
    sources:
      - path: Sources
      - path: ../App/App/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.waymuse.student
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
